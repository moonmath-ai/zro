name: Release binaries

# Builds standalone SEA binaries for Linux and macOS and attaches them to the
# GitHub release created by publish.yml. Runs on the same tag push. Windows is
# intentionally unsupported (the CLI directs Windows users to WSL).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag (v-something) to build binaries for. Leave empty to use the current ref.
        required: false

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-14 }
          - { target: darwin-x64, os: macos-13 }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download official Node binary for this platform
        run: |
          # Pin an explicit Node build so the SEA blob and host binary always match
          # (V8 version checks require blob and host to come from the same build).
          NODE_VERSION="v22.19.0"
          case "${{ matrix.target }}" in
            darwin-arm64) dist="node-${NODE_VERSION}-darwin-arm64.tar.gz" ;;
            darwin-x64)   dist="node-${NODE_VERSION}-darwin-x64.tar.gz"   ;;
            linux-x64)    dist="node-${NODE_VERSION}-linux-x64.tar.gz"    ;;
            linux-arm64)  dist="node-${NODE_VERSION}-linux-arm64.tar.gz"  ;;
          esac
          mkdir -p artifacts/node-dist
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/${dist}" -o artifacts/node-dist/node.tar.gz
          tar -xzf artifacts/node-dist/node.tar.gz -C artifacts/node-dist
          ls artifacts/node-dist

      - name: Resolve host node path
        run: |
          HOST=$(ls -d artifacts/node-dist/node-*/bin/node | head -1)
          echo "NODE_HOST_BIN=$PWD/$HOST" >> "$GITHUB_ENV"
          "$PWD/$HOST" --version

      - name: Build binary
        run: node scripts/build-binary.mjs --target ${{ matrix.target }} --node-path "$NODE_HOST_BIN"

      - name: Smoke-test the binary
        run: ./artifacts/bin/zro-${{ matrix.target }} --help > /dev/null

      - name: Upload binary artifacts
        uses: actions/upload-artifact@bbbca2ddaa1d34f5a8d554a406e1e4516b72774d # v7.0.0
        with:
          name: zro-${{ matrix.target }}
          path: artifacts/bin/
          if-no-files-found: error

  attach:
    name: Attach binaries to GitHub release
    runs-on: ubuntu-latest
    needs: binaries
    if: github.event_name == 'push'
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@8d4c3684fbf1f8def23b5a09adf24b4921ff2014 # v8.0.0
        with:
          path: dist-bin
          merge-multiple: true

      - name: Merge checksum files
        run: |
          # Each matrix leg wrote its own SHA256SUMS with one row; merge and dedupe.
          find dist-bin -name SHA256SUMS -exec cat {} + | sort -u > SHA256SUMS
          cat SHA256SUMS
          mkdir -p release
          find dist-bin -type f -name 'zro-*' -exec cp {} release/ \;
          mv SHA256SUMS release/

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
