name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag (v-something) to publish. Leave empty to use the current ref.
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify version matches tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ "v$VERSION" != "$TAG" ]]; then
            echo "Tag $TAG does not match package version v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: v${{ env.version }}
          name: v${{ env.version }}
          generate_release_notes: true
